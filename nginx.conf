server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets as-is
  location /assets/ {
    try_files $uri =404;
  }

  # If deployed under a subpath, e.g., /Migration, use this instead:
  # location /Migration/assets/ { try_files $uri =404; }

  # SPA fallback (root deploy)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # If using a subpath /Migration, replace the block above with:
  # location /Migration/ {
  #   try_files $uri $uri/ /Migration/index.html;
  # }
}
